[package]
name = "myterm"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "myterm"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui = "0.29"
ratatui = { version = "0.29", default-features = false }
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
fuzzy-matcher = "0.3"
which = "7"
anyhow = "1"
vte = "0.13"
image = { version = "0.25", default-features = false, features = ["png"] }
